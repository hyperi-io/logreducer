name: PR Validation

env:
  # Default entity name - can be overridden in organization/repo settings
  CICD_ENTITY: ${{ vars.CICD_ENTITY || 'HyperI' }}

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'
  pull_request_target:
    types: [opened, synchronize, edited, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'

jobs:
  branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install branch-name-lint
      run: npm install branch-name-lint
    
    - name: Validate branch name
      run: |
        echo "[SEARCH] Validating ${{ env.CICD_ENTITY }} branch name: ${{ github.head_ref }}"
        
        # Protected branches are allowed
        if echo "${{ github.head_ref }}" | grep -qE "^(main|master|develop|development|staging|production)$"; then
          echo "[PASS] Protected branch, skipping validation"
          exit 0
        fi
        
        # Create temporary git repo for branch-name-lint
        git init temp-repo
        cd temp-repo
        git checkout -b "${{ github.head_ref }}"
        
        # Run branch-name-lint
        npx branch-name-lint ../.branchlintrc.json
        
        if [ $? -ne 0 ]; then
          echo "[FAIL] ${{ env.CICD_ENTITY }} branch name validation failed!"
          echo ""
          echo "${{ env.CICD_ENTITY }} valid patterns:"
          echo "  feature/description or feature/JIRA-123-description"
          echo "  fix/bug-description"
          echo "  hotfix/critical-fix"
          echo "  release/X.Y.Z"
          echo "  docs/update-description"
          echo "  chore/task-description"
          echo ""
          echo "Your branch: ${{ github.head_ref }}"
          exit 1
        fi
        
        echo "[PASS] Branch name is valid"

  commit-messages:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install commitlint
      run: |
        npm install @commitlint/cli @commitlint/config-conventional
    
    - name: Validate commits
      run: |
        echo "[SEARCH] Validating ${{ env.CICD_ENTITY }} commit messages..."
        
        # Get all commits in the PR
        COMMITS=$(git log --format=%H origin/${{ github.base_ref }}..${{ github.head_ref }} 2>/dev/null || git log --format=%H HEAD~10..HEAD)
        
        FAILED=0
        for COMMIT in $COMMITS; do
          MESSAGE=$(git log -1 --format=%B $COMMIT)
          
          # Skip merge commits
          if echo "$MESSAGE" | grep -q "^Merge "; then
            echo "[PASS] Skipping merge commit: $COMMIT"
            continue
          fi
          
          # Validate with commitlint
          echo "$MESSAGE" | npx commitlint
          
          if [ $? -ne 0 ]; then
            echo "[FAIL] Invalid commit message for $COMMIT:"
            echo "$MESSAGE"
            echo ""
            FAILED=1
          else
            echo "[PASS] Valid: $(echo "$MESSAGE" | head -1)"
          fi
        done
        
        if [ $FAILED -eq 1 ]; then
          echo ""
          echo "[FAIL] Some commit messages don't follow ${{ env.CICD_ENTITY }} conventional format"
          echo ""
          echo "${{ env.CICD_ENTITY }} expected format: type(scope): description"
          echo ""
          echo "Valid types:"
          echo "  feat:     New feature (minor version bump)"
          echo "  fix:      Bug fix (patch version bump)"
          echo "  docs:     Documentation only"
          echo "  style:    Code style changes"
          echo "  refactor: Code refactoring"
          echo "  perf:     Performance improvement (patch version bump)"
          echo "  test:     Test changes"
          echo "  build:    Build system changes"
          echo "  ci:       CI/CD changes"
          echo "  chore:    Maintenance tasks"
          echo ""
          echo "Examples:"
          echo "  feat: add prometheus metrics"
          echo "  fix(parser): resolve memory leak"
          echo "  feat!: breaking API changes"
          exit 1
        fi
        
        echo "[PASS] All commit messages are valid"

  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install commitlint
      run: |
        npm install @commitlint/cli @commitlint/config-conventional
    
    - name: Validate PR title
      run: |
        echo "[SEARCH] Validating ${{ env.CICD_ENTITY }} PR title..."
        echo "${{ github.event.pull_request.title }}" | npx commitlint
        
        if [ $? -ne 0 ]; then
          echo ""
          echo "[FAIL] PR title must follow ${{ env.CICD_ENTITY }} conventional commit format"
          echo ""
          echo "Current title: ${{ github.event.pull_request.title }}"
          echo ""
          echo "${{ env.CICD_ENTITY }} expected format: type(scope): description"
          echo ""
          echo "Examples:"
          echo "  feat: add new feature"
          echo "  fix(api): resolve authentication bug"
          echo "  docs: update README"
          echo ""
          echo "The PR title will be used as the merge commit message,"
          echo "which determines the version bump in semantic release."
          exit 1
        fi
        
        echo "[PASS] PR title is valid"

  check-jira:
    name: Check for JIRA References
    runs-on: ubuntu-latest
    # Only run on feature/fix branches and skip for documentation-only PRs
    if: (contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'fix/') || contains(github.event.pull_request.head.ref, 'hotfix/')) && github.event.pull_request.changed_files > 0
    
    steps:
    - name: Check for JIRA reference
      run: |
        echo "[SEARCH] Checking for ${{ env.CICD_ENTITY }} JIRA references..."
        
        PR_BODY="${{ github.event.pull_request.body }}"
        PR_TITLE="${{ github.event.pull_request.title }}"
        BRANCH="${{ github.head_ref }}"
        
        # Check if JIRA key exists in branch, title, or body
        if echo "$BRANCH $PR_TITLE $PR_BODY" | grep -qE "[A-Z]+-[0-9]+"; then
          JIRA_KEYS=$(echo "$BRANCH $PR_TITLE $PR_BODY" | grep -oE "[A-Z]+-[0-9]+" | sort -u)
          echo "[PASS] Found JIRA references: $JIRA_KEYS"
        else
          echo "[WARN]  Warning: No JIRA reference found"
          echo ""
          echo "Consider adding a JIRA ticket reference in:"
          echo "  - Branch name: feature/PROJ-123-description"
          echo "  - PR title: feat(PROJ-123): add feature"
          echo "  - PR body: Fixes PROJ-123"
          echo ""
          echo "This is a warning only - not blocking the PR"
        fi

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [branch-name, commit-messages, pr-title]
    if: always()
    
    steps:
    - name: Summary
      run: |
        echo "## ${{ env.CICD_ENTITY }} PR Validation Summary"
        echo ""
        
        if [ "${{ needs.branch-name.result }}" == "success" ]; then
          echo "[PASS] Branch name validation: Passed"
        else
          echo "[FAIL] Branch name validation: Failed"
        fi
        
        if [ "${{ needs.commit-messages.result }}" == "success" ]; then
          echo "[PASS] Commit message validation: Passed"
        else
          echo "[FAIL] Commit message validation: Failed"
        fi
        
        if [ "${{ needs.pr-title.result }}" == "success" ]; then
          echo "[PASS] PR title validation: Passed"
        else
          echo "[FAIL] PR title validation: Failed"
        fi
        
        echo ""
        
        if [ "${{ needs.branch-name.result }}" != "success" ] || \
           [ "${{ needs.commit-messages.result }}" != "success" ] || \
           [ "${{ needs.pr-title.result }}" != "success" ]; then
          echo "[FAIL] PR validation failed. Please fix the issues above."
          exit 1
        fi
        
        echo "[PASS] All validations passed!"