name: Manual JFrog Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave empty to use current)'
        required: false
        type: string

jobs:
  deploy-to-jfrog:
    name: Deploy to JFrog Artifactory
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade build twine
    
    - name: Build package
      run: |
        echo "Building packages..."
        python -m build
        echo ""
        echo "Built packages:"
        ls -la dist/
    
    - name: Get package version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Deploying version: $VERSION"
    
    - name: Check JFrog credentials
      run: |
        if [ -z "${{ secrets.ARTIFACTORY_USERNAME }}" ] || [ -z "${{ secrets.ARTIFACTORY_PASSWORD }}" ]; then
          echo "[FAIL] ERROR: Missing JFrog credentials!"
          echo ""
          echo "Please add these secrets to your repository:"
          echo "1. Go to: Settings -> Secrets and variables -> Actions"
          echo "2. Add ARTIFACTORY_USERNAME"
          echo "3. Add ARTIFACTORY_PASSWORD"
          exit 1
        fi
        echo "[PASS] JFrog credentials configured"
    
    - name: Deploy to JFrog Artifactory
      env:
        TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_REPOSITORY_URL: "https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-local/"
      run: |
        echo "[PKG] Deploying to JFrog Artifactory..."
        echo "Repository: $TWINE_REPOSITORY_URL"
        echo "Version: ${{ steps.version.outputs.version }}"
        echo ""
        
        # Upload packages
        twine upload --verbose dist/*
        
        echo ""
        echo "[PASS] SUCCESS: Packages deployed to JFrog Artifactory!"
        echo ""
        echo "To install:"
        echo "  pip install logreducer==${{ steps.version.outputs.version }} --index-url $TWINE_REPOSITORY_URL"
    
    - name: Create deployment summary
      if: always()
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # JFrog Deployment Summary
        
        ## Package Information
        - **Version**: ${{ steps.version.outputs.version }}
        - **Repository**: hyperi-pypi-local
        - **Time**: $(date)
        
        ## Artifacts Deployed
        \`\`\`
        $(ls -lh dist/)
        \`\`\`
        
        ## Installation Command
        \`\`\`bash
        pip install logreducer==${{ steps.version.outputs.version }} \\
          --index-url https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-local/simple
        \`\`\`
        
        ## View in JFrog
        [Open JFrog Artifactory](https://hyperi.jfrog.io)
        EOF