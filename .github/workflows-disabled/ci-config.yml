# CI/CD Configuration
# Controls whether CI runs locally or in GitHub Actions

# Main CI configuration
ci:
  # Set to 'github' to use GitHub Actions, 'local' to use local CI
  runner: local
  
  # Deployment configuration
  deployment:
    # Auto-deploy to JFrog on main branch pushes
    auto_deploy: false
    
    # JFrog Artifactory URLs for different environments
    # Credentials are stored in GitHub Secrets: ARTIFACTORY_USERNAME and ARTIFACTORY_PASSWORD
    artifactory_urls:
      production: "https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-local/"
      staging: "https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-staging/"
      test: "https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-test/"
  
  # Security configuration
  security:
    # Minimum security level (NONE, LOW, MEDIUM, HIGH, CRITICAL)
    min_level: NONE
    
    # Block CI on security issues
    block_on_failure: true
  
  # Test configuration
  tests:
    # Run slow integration tests in CI
    run_slow_tests: false
    
    # Test timeout in seconds
    timeout: 600
    
    # Coverage requirements
    coverage:
      enabled: true
      min_percentage: 90

# GitHub Actions specific settings
github_actions:
  # Use these settings when USE_GITHUB_ACTIONS=true
  
  # Runner type (ubuntu-latest, self-hosted, etc.)
  runner: ubuntu-latest
  
  # Python versions to test
  python_versions:
    - "3.12"
  
  # Cache dependencies
  cache_dependencies: true
  
  # Upload artifacts
  artifacts:
    test_results: true
    coverage_reports: true
    build_packages: true
    retention_days: 7

# Local CI specific settings
local_ci:
  # Use these settings when running CI locally
  
  # Parallel jobs for testing
  parallel_jobs: 4
  
  # Verbose output
  verbose: true
  
  # Auto-fix issues when possible
  auto_fix: false
  
  # Log file location
  log_file: ".tmp/logs/local-ci.log"

# Environment variables to set
environment:
  # These will be set as environment variables in CI
  MIN_SECURITY_LEVEL: "${ci.security.min_level}"
  PYTEST_TIMEOUT: "${ci.tests.timeout}"
  COVERAGE_MIN: "${ci.tests.coverage.min_percentage}"

# Notification settings (future enhancement)
notifications:
  # Slack, email, etc.
  enabled: false
