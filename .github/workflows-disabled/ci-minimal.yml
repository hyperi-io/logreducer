name: Minimal CI (Local Runner)

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'
  pull_request:
    branches: [ main ]

env:
  # Set to 'true' to run CI in GitHub Actions instead of locally
  USE_GITHUB_ACTIONS: ${{ vars.USE_GITHUB_ACTIONS || 'false' }}
  MIN_SECURITY_LEVEL: ${{ vars.MIN_SECURITY_LEVEL || 'NONE' }}

jobs:
  local-ci:
    name: Run CI Locally
    runs-on: ubuntu-latest
    if: ${{ vars.USE_GITHUB_ACTIONS != 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Setup environment
      run: |
        python3 scripts/setup
    
    - name: Run local CI pipeline
      run: |
        python3 scripts/local-ci --skip-slow
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          .tmp/reports/
          coverage.xml
        retention-days: 7
    
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  # Optional: Deploy to JFrog on main branch
  auto-deploy:
    name: Auto Deploy to JFrog
    runs-on: ubuntu-latest
    needs: [local-ci]
    if: |
      success() && 
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push' &&
      vars.AUTO_DEPLOY_TO_JFROG == 'true'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install twine
      run: |
        python -m pip install --upgrade twine
    
    - name: Deploy to JFrog Artifactory
      env:
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USERNAME }}
        ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_REPOSITORY_URL: ${{ vars.ARTIFACTORY_URL || 'https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-local/' }}
      run: |
        twine upload dist/* --verbose
