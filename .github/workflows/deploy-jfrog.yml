name: Deploy to JFrog Artifactory (Manual Only)

# This is the ONLY workflow that runs in GitHub Actions
# All CI/CD runs locally - this is just for secure JFrog deployment
# 
# WORKFLOW:
# 1. Run CI locally: make ci
# 2. Verify dist/ contains wheel and tarball
# 3. Commit the dist/ files (optional)
# 4. Trigger this workflow to deploy

on:
  workflow_dispatch:  # Manual trigger only - NEVER automatic
    inputs:
      deploy_environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - test
      use_existing_artifacts:
        description: 'Use existing dist/ artifacts (if committed) or rebuild'
        required: true
        default: 'rebuild'
        type: choice
        options:
          - rebuild
          - use_existing

env:
  PYTHON_VERSION: "3.12"

jobs:
  deploy-jfrog:
    name: Deploy to JFrog Artifactory
    runs-on: ${{ vars.GH_RUNNER_DEFAULT || 'ubuntu-latest' }}    environment: ${{ github.event.inputs.deploy_environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip twine
        if [[ "${{ github.event.inputs.use_existing_artifacts }}" == "rebuild" ]]; then
          python -m pip install --upgrade build
        fi
    
    - name: Check for existing artifacts
      if: ${{ github.event.inputs.use_existing_artifacts == 'use_existing' }}
      run: |
        if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
          echo "[FAIL] No artifacts found in dist/"
          echo "Please either:"
          echo "1. Run 'make ci' locally and commit the dist/ folder, OR"
          echo "2. Choose 'rebuild' option to build fresh artifacts"
          exit 1
        fi
        echo "[PASS] Found existing artifacts:"
        ls -la dist/
    
    - name: Build packages
      if: ${{ github.event.inputs.use_existing_artifacts == 'rebuild' }}
      run: |
        echo "Building fresh packages..."
        rm -rf dist/
        python -m build
        echo "[PASS] Built packages:"
        ls -la dist/
    
    - name: Validate packages
      run: |
        echo "Validating packages..."
        python -m twine check dist/*
        
        # Check for wheel
        if ! ls dist/*.whl 1> /dev/null 2>&1; then
          echo "[FAIL] No wheel file found in dist/"
          exit 1
        fi
        
        # Check for source distribution
        if ! ls dist/*.tar.gz 1> /dev/null 2>&1; then
          echo "[FAIL] No source distribution found in dist/"
          exit 1
        fi
        
        echo "[PASS] Package validation passed"
        echo "Files to deploy:"
        ls -lh dist/
    
    - name: Configure JFrog repository URL
      id: jfrog-config
      run: |
        if [[ "${{ github.event.inputs.deploy_environment }}" == "production" ]]; then
          echo "repo_url=https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-local/" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event.inputs.deploy_environment }}" == "staging" ]]; then
          echo "repo_url=https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-staging/" >> $GITHUB_OUTPUT
        else
          echo "repo_url=https://hyperi.jfrog.io/artifactory/api/pypi/hyperi-pypi-test/" >> $GITHUB_OUTPUT
        fi
        echo "Target repository: $(grep repo_url $GITHUB_OUTPUT | cut -d= -f2)"
    
    - name: Deploy to JFrog Artifactory
      env:
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USERNAME }}
        ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_REPOSITORY_URL: ${{ steps.jfrog-config.outputs.repo_url }}
      run: |
        echo "========================================="
        echo "Deploying to JFrog Artifactory"
        echo "========================================="
        echo "Environment: ${{ github.event.inputs.deploy_environment }}"
        echo "Repository: $TWINE_REPOSITORY_URL"
        echo "Artifacts: $(ls dist/*.whl dist/*.tar.gz 2>/dev/null | wc -l) files"
        echo "========================================="
        
        # Deploy with verbose output
        python -m twine upload dist/* --verbose
        
        echo "========================================="
        echo "[PASS] Deployment completed successfully"
        echo "========================================="