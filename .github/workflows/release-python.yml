name: Semantic Release (Python)

on:
  workflow_dispatch:  # Manual trigger for testing
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

env:
  PYTHON_VERSION: "3.12"
  # Set minimum acceptable security level for release builds
  MIN_SECURITY_LEVEL: NONE

permissions:
  contents: write
  issues: write  
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Python Semantic Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install uv for faster package management
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv pip install --system python-semantic-release build twine pyyaml loguru dynaconf
    
    - name: Check current version and git tags
      run: |
        echo "Current VERSION file: $(cat VERSION)"
        echo "Current pyproject.toml version: $(grep '^version' pyproject.toml | head -1)"
        echo "Current __init__.py version: $(grep '__version__' src/logreducer/__init__.py)"
        echo ""
        echo "Git tags available:"
        git tag --list -n1
        echo ""
        echo "Git log (last 5 commits):"
        git log --oneline -5
        echo ""
        echo "Semantic-release version detection:"
        semantic-release version --print-last-released || echo "No last released version found"
        semantic-release version --print || echo "Could not determine next version"
    
    - name: Run Semantic Release
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PRE_COMMIT_ALLOW_NO_CONFIG: "1"
      run: |
        # Check if there will be a new version
        NEXT_VERSION=$(semantic-release version --print)
        LAST_VERSION=$(semantic-release version --print-last-released)
        
        if [ "$NEXT_VERSION" != "$LAST_VERSION" ]; then
          echo "Bumping version from $LAST_VERSION to $NEXT_VERSION"
          echo "new_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          
          # Run semantic-release to handle version bump, tagging, and pushing
          # This will update pyproject.toml, __init__.py, create tag, and push
          semantic-release version
          
          # Update VERSION file to match
          python scripts/ci-helper update-version "$NEXT_VERSION"
          
          # Commit the VERSION file update
          git config user.email "semantic-release@github.com"
          git config user.name "GitHub Actions"
          git add VERSION
          git commit -m "chore: update VERSION file to $NEXT_VERSION [skip ci]" || true
          git push || true
          
          # Build the package with the new version
          python -m build
          
          # Create GitHub release with artifacts
          gh release create "v$NEXT_VERSION" \
            --title "v$NEXT_VERSION" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz || echo "Release might already exist"
        else
          echo "No version bump needed"
          echo "new_version=" >> $GITHUB_OUTPUT
        fi
    
    - name: Verify VERSION file update
      if: steps.release.outputs.new_version
      run: |
        python scripts/ci-helper verify-versions
    
    - name: Upload build artifacts
      if: steps.release.outputs.new_version
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Deploy to PyPI (if configured)
      if: steps.release.outputs.new_version && vars.ENABLE_PYPI_DEPLOYMENT == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "Deploying to PyPI..."
        twine upload dist/*
    
    - name: Deploy to JFrog (if configured)
      if: steps.release.outputs.new_version && vars.ENABLE_ARTIFACTORY_DEPLOYMENT == 'true'
      env:
        TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_REPOSITORY_URL: "https://hypersec.jfrog.io/artifactory/api/pypi/hypersec-pypi-local/"
      run: |
        echo "Deploying to JFrog Artifactory..."
        twine upload --repository-url $TWINE_REPOSITORY_URL dist/*