name: Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # Suppress uv hardlink warnings in CI
  UV_LINK_MODE: copy

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv pip install -e ".[docs,enhanced]"
    
    - name: Generate API documentation
      run: |
        # Generate module documentation
        uv run sphinx-apidoc -f -o docs/api src/logreducer/
    
    - name: Build Sphinx documentation
      run: |
        uv run sphinx-build -W -b html docs/ docs/_build/html
    
    - name: Check documentation links
      run: |
        uv run sphinx-build -b linkcheck docs/ docs/_build/linkcheck
      continue-on-error: true
    
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation-html
        path: docs/_build/html/
        retention-days: 30
    
    - name: Upload linkcheck results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linkcheck-results
        path: docs/_build/linkcheck/
        retention-days: 7

  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Download documentation artifacts
      uses: actions/download-artifact@v4
      with:
        name: documentation-html
        path: ./docs
    
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  validate-examples:
    name: Validate Documentation Examples
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv pip install -e ".[enhanced]"
    
    - name: Test documentation examples
      run: |
        # Extract and test Python code blocks from documentation
        python -c "
        import subprocess
        import os
        from pathlib import Path
        
        # Test basic usage example
        test_code = '''
from logreducer import LogReducer
reducer = LogReducer()
print('LogReducer imported successfully')
        '''
        
        with open('.tmp/test_example.py', 'w') as f:
            f.write(test_code)
        
        result = subprocess.run(['python', '.tmp/test_example.py'], 
                              capture_output=True, text=True)
        if result.returncode != 0:
            print(f'Example test failed: {result.stderr}')
            exit(1)
        else:
            print('Documentation examples validated successfully')
        "
    
    - name: Test CLI examples
      run: |
        # Test CLI examples from documentation
        uv run logreducer --help > /dev/null
        echo "CLI help command works"
        
        # Test with sample data if available
        if [ -f "data/samples/samples/apache_access.log" ]; then
          uv run logreducer data/samples/samples/apache_access.log --estimate
          echo "CLI estimation example works"
        fi

  coverage-docs:
    name: Documentation Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv pip install -e ".[docs]"
    
    - name: Generate coverage report
      run: |
        # Generate documentation coverage report
        uv run sphinx-build -b coverage docs/ docs/_build/coverage
    
    - name: Upload coverage results
      uses: actions/upload-artifact@v4
      with:
        name: docs-coverage
        path: docs/_build/coverage/
        retention-days: 7
    
    - name: Comment coverage results
      if: github.event_name == 'pull_request'
      run: |
        if [ -f "docs/_build/coverage/python.txt" ]; then
          echo "## Documentation Coverage Report" >> coverage_comment.md
          echo "\`\`\`" >> coverage_comment.md
          cat docs/_build/coverage/python.txt >> coverage_comment.md
          echo "\`\`\`" >> coverage_comment.md
          
          # This would need a GitHub token to post as a comment
          # For now, just display the results
          cat coverage_comment.md
        fi