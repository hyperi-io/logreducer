name: Semantic Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    
    - name: Load environment configuration
      run: |
        # Load .env file if it exists, otherwise use defaults
        if [ -f .env ]; then
          echo "Loading .env file..."
          cat .env
          export $(cat .env | grep -v '^#' | xargs)
        else
          echo ".env file not found, using defaults"
        fi
        
        # Set environment variables for GitHub Actions
        echo "ENABLE_PYPI_DEPLOYMENT=${ENABLE_PYPI_DEPLOYMENT:-OFF}" >> $GITHUB_ENV
        echo "ENABLE_GITHUB_RELEASE=${ENABLE_GITHUB_RELEASE:-ON}" >> $GITHUB_ENV
        echo "ENABLE_ARTIFACTORY_DEPLOYMENT=${ENABLE_ARTIFACTORY_DEPLOYMENT:-OFF}" >> $GITHUB_ENV
        echo "ENABLE_SEMANTIC_RELEASE=${ENABLE_SEMANTIC_RELEASE:-ON}" >> $GITHUB_ENV
        
        # Debug output
        echo "Environment configuration:"
        echo "ENABLE_SEMANTIC_RELEASE: ${ENABLE_SEMANTIC_RELEASE:-ON}"
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Node dependencies
      run: npm ci
    
    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Run vulnerability scan with pip-audit
      run: |
        pip install --upgrade pip-audit bandit semgrep
        echo "Running dependency vulnerability scan..."
        pip-audit --format=json --output=pip-audit-report.json || echo "pip-audit scan completed with warnings"
        
        echo "Running static security analysis with bandit..."
        bandit -r src/ -f json -o bandit-report.json || echo "Bandit scan completed with warnings"
        
        echo "Running semantic security analysis with semgrep..."
        semgrep --config=auto src/ --json --output=semgrep-report.json || echo "Semgrep scan completed with warnings"
        
        # Upload scan results as artifacts
        echo "Security scans completed. Check artifacts for detailed reports."
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: |
          pip-audit-report.json
          bandit-report.json  
          semgrep-report.json
    
    - name: Build Python package
      run: python -m build
    
    - name: Run Semantic Release
      if: env.ENABLE_SEMANTIC_RELEASE == 'ON'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USERNAME }}
        ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_PASSWORD }}
      run: |
        echo "Running semantic-release with debug output..."
        echo "Current directory: $(pwd)"
        echo "Git status:"
        git status
        echo "Recent commits:"
        git log --oneline -5
        echo "Running semantic-release..."
        npx semantic-release --debug
    
    # VERSION file and pyproject.toml are automatically updated by semantic-release
    # via the @semantic-release/exec plugin configuration in .releaserc.json
    # No additional version update steps needed here
    
    - name: Deploy to JFrog Artifactory
      if: success() && github.ref == 'refs/heads/main' && env.ENABLE_ARTIFACTORY_DEPLOYMENT == 'ON'
      env:
        TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_REPOSITORY_URL: "https://hypersec.jfrog.io/artifactory/api/pypi/hypersec-pypi-local/"
      run: |
        echo "Deploying to JFrog Artifactory..."
        twine upload --non-interactive --disable-progress-bar dist/*
    
    - name: Deploy to PyPI
      if: success() && github.ref == 'refs/heads/main' && env.ENABLE_PYPI_DEPLOYMENT == 'ON'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "Deploying to PyPI..."
        twine upload --non-interactive --disable-progress-bar dist/*
    
    - name: Create GitHub Release
      if: success() && github.ref == 'refs/heads/main' && env.ENABLE_GITHUB_RELEASE == 'ON'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "GitHub Release creation handled by semantic-release"