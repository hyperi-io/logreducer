name: Runner Security Monitor

on:
  workflow_run:
    workflows: ["*"]
    types: [requested, completed]
  pull_request:
    paths:
      - '.github/workflows/**'
  
jobs:
  monitor-runner-usage:
    name: Monitor Self-Hosted Runner Usage
    runs-on: ubuntu-latest  # Always use GitHub-hosted for monitoring
    
    steps:
    - name: Check actor authorization
      run: |
        echo "🔍 Checking runner usage by: ${{ github.actor }}"
        echo "Workflow: ${{ github.event.workflow.name || 'Direct trigger' }}"
        echo "Event: ${{ github.event_name }}"
        
        # Define authorized users
        AUTHORIZED_USERS=("derek" "dependabot[bot]" "github-actions[bot]")
        
        # Check if actor is authorized
        AUTHORIZED=false
        for user in "${AUTHORIZED_USERS[@]}"; do
          if [ "${{ github.actor }}" = "$user" ]; then
            AUTHORIZED=true
            break
          fi
        done
        
        if [ "$AUTHORIZED" = false ]; then
          echo "⚠️ WARNING: Unauthorized user attempting to use runners!"
          echo "User: ${{ github.actor }}"
          echo "This requires immediate review!"
          
          # Create issue for unauthorized access
          gh issue create \
            --title "⚠️ Security Alert: Unauthorized Runner Access Attempt" \
            --body "User **${{ github.actor }}** attempted to trigger workflows.
            
            Workflow: ${{ github.event.workflow.name }}
            Event: ${{ github.event_name }}
            Time: $(date)
            
            Please review and take appropriate action." \
            --label "security,urgent"
          
          exit 1
        else
          echo "✅ Authorized user confirmed"
        fi
    
    - name: Log workflow changes
      if: github.event_name == 'pull_request'
      run: |
        echo "Workflow changes detected in PR #${{ github.event.pull_request.number }}"
        echo "Changed files:"
        echo "${{ github.event.pull_request.changed_files }}"
        
        # Alert on workflow modifications
        if [[ "${{ github.event.pull_request.user.login }}" != "derek" ]]; then
          echo "⚠️ Non-owner modifying workflows - requires careful review!"
        fi

  validate-workflow-safety:
    name: Validate Workflow Safety
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout PR
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - name: Check for dangerous patterns
      run: |
        echo "🔍 Scanning workflows for dangerous patterns..."
        
        # Check for dangerous commands in workflows
        DANGEROUS_PATTERNS=(
          "curl.*\|.*sh"
          "wget.*\|.*sh"
          "eval"
          "base64.*-d"
          "rm -rf /"
          "/etc/passwd"
          "/etc/shadow"
          "~/.ssh"
          "GITHUB_TOKEN"
          "secrets\."
        )
        
        FOUND_ISSUES=false
        for pattern in "${DANGEROUS_PATTERNS[@]}"; do
          if grep -r "$pattern" .github/workflows/ 2>/dev/null; then
            echo "⚠️ Found potentially dangerous pattern: $pattern"
            FOUND_ISSUES=true
          fi
        done
        
        if [ "$FOUND_ISSUES" = true ]; then
          echo "❌ Dangerous patterns detected in workflows!"
          echo "Please review carefully before merging."
          exit 1
        else
          echo "✅ No obvious dangerous patterns found"
        fi