name: CI/CD Pipeline

on:
  workflow_dispatch:  # Manual trigger available
  push:
    branches: [ main, develop ]  # Re-enabled automated triggers
  pull_request:
    branches: [ main ]

env:
  # PYTHON_VERSION is now dynamically loaded from .python-version-config.yaml
  # Suppress uv hardlink warnings in CI
  UV_LINK_MODE: copy

jobs:
  detect-python-version:
    name: Load Python Version Configuration
    runs-on: ubuntu-latest
    outputs:
      min-version: ${{ steps.config.outputs.min-version }}
      test-matrix: ${{ steps.config.outputs.test-matrix }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Load Python version configuration
      id: config
      run: |
        # Extract minimum version from config file
        if [ -f .python-version-config.yaml ]; then
          MIN_VERSION=$(python3 -c "
          import yaml
          with open('.python-version-config.yaml') as f:
              config = yaml.safe_load(f)
              print(config['template_minimum'])
          " 2>/dev/null || echo "3.12")
        else
          MIN_VERSION="3.12"
        fi
        
        echo "min-version=$MIN_VERSION" >> $GITHUB_OUTPUT
        
        # Generate test matrix based on minimum version
        MIN_MINOR=$(echo $MIN_VERSION | cut -d. -f2)
        VERSIONS=""
        for i in $(seq $MIN_MINOR 13); do
          if [ -n "$VERSIONS" ]; then
            VERSIONS="$VERSIONS, "
          fi
          VERSIONS="$VERSIONS\"3.$i\""
        done
        echo "test-matrix=[$VERSIONS]" >> $GITHUB_OUTPUT
        
        echo "📋 Configuration loaded:"
        echo "  Minimum Python: $MIN_VERSION"
        echo "  Test matrix: [$VERSIONS]"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: detect-python-version
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.detect-python-version.outputs.test-matrix) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for semantic release
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,enhanced]"
    
    - name: Lint with flake8
      run: |
        flake8 logreducer/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 logreducer/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Format check with black
      run: |
        black --check logreducer/
    
    - name: Type check with mypy
      run: |
        mypy logreducer/ || true  # Non-blocking for now
    
    - name: Test PEP 660 editable install compatibility
      run: |
        python scripts/test_editable_install.py
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=logreducer --cov-report=xml --cov-report=term-missing
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v -m "not slow"
    
    - name: Run slow integration tests
      if: matrix.python-version == '3.11'  # Only run on one version to save time
      run: |
        pytest tests/integration/ -v -m slow
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: [test, detect-python-version]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade pip-audit bandit
        pip install -e .
    
    - name: Check dependencies for vulnerabilities
      run: |
        pip-audit
    
    - name: Run bandit security scan
      run: |
        bandit -r logreducer/ -f json -o bandit-report.json || true
        bandit -r logreducer/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, detect-python-version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Install semantic-release
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade python-semantic-release
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Semantic Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY_USERNAME: __token__
        REPOSITORY_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        semantic-release publish

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, detect-python-version]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Install twine
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade twine
    
    - name: Deploy to staging PyPI
      env:
        TWINE_USERNAME: ${{ secrets.STAGING_PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.STAGING_PYPI_PASSWORD }}
        TWINE_REPOSITORY_URL: ${{ secrets.STAGING_PYPI_URL }}
      run: |
        twine upload dist/* --verbose

  deploy-production:
    name: Deploy to Production  
    runs-on: ubuntu-latest
    needs: [release, detect-python-version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Install twine
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade twine
    
    - name: Deploy to JFrog Artifactory
      env:
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USERNAME }}
        ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_REPOSITORY_URL: "https://hypersec.jfrog.io/artifactory/api/pypi/hypersec-pypi-local/simple/"
      run: |
        twine upload dist/* --verbose