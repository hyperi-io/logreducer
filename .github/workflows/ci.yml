name: CI/CD Pipeline

on:
  workflow_dispatch:  # Manual trigger available
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.env.example'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'

env:
  # PYTHON_VERSION is now dynamically loaded from .python-version-config.yaml
  # Suppress uv hardlink warnings in CI
  UV_LINK_MODE: copy

jobs:
  detect-python-version:
    name: Load Python Version Configuration
    runs-on: ubuntu-latest
    outputs:
      min-version: ${{ steps.config.outputs.min-version }}
      test-matrix: ${{ steps.config.outputs.test-matrix }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Load Python version configuration
      id: config
      run: |
        # Extract minimum version from config file
        if [ -f .python-version-config.yaml ]; then
          MIN_VERSION=$(python3 -c "
          import yaml
          with open('.python-version-config.yaml') as f:
              config = yaml.safe_load(f)
              print(config['template_minimum'])
          " 2>/dev/null || echo "3.12")
        else
          MIN_VERSION="3.12"
        fi
        
        echo "min-version=$MIN_VERSION" >> $GITHUB_OUTPUT
        
        # Generate test matrix - only test with our minimum version for now
        # Can expand to test newer versions once confirmed working
        echo "test-matrix=[\"$MIN_VERSION\"]" >> $GITHUB_OUTPUT
        
        echo "Configuration loaded:"
        echo "  Minimum Python: $MIN_VERSION"
        echo "  Test matrix: [\"$MIN_VERSION\"]"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: detect-python-version
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.detect-python-version.outputs.test-matrix) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for semantic release
        lfs: true
    
    - name: Pull LFS files
      run: |
        git lfs install
        git lfs pull
        echo "Verifying sample files:"
        ls -la data/samples/*.log || echo "Sample files not found"
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,enhanced]"
    
    - name: Lint with flake8
      run: |
        flake8 src/logreducer/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/logreducer/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Format check with black
      run: |
        black --check src/logreducer/
    
    - name: Type check with mypy
      run: |
        mypy src/logreducer/ || true  # Non-blocking for now
    
    - name: Test PEP 660 editable install compatibility
      run: |
        python scripts/ci-helper test-editable
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=logreducer --cov-report=xml --cov-report=term-missing
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v -m "not slow"
    
    - name: Run slow integration tests
      if: matrix.python-version == '3.12'  # Only run on one version to save time
      run: |
        pytest tests/integration/ -v -m slow
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: [test, detect-python-version]
    continue-on-error: false  # Security scan must pass
    
    env:
      # Set minimum acceptable security level - NONE means zero tolerance (default)
      # Valid levels: NONE, LOW, MEDIUM, HIGH, CRITICAL
      MIN_SECURITY_LEVEL: NONE
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,enhanced]"
    
    - name: Run security scan with configurable threshold
      run: |
        echo "Running security scan with MIN_SECURITY_LEVEL=${MIN_SECURITY_LEVEL}"
        # Create a dummy .venv directory to satisfy the script check
        mkdir -p .venv/bin
        ln -s $(which python) .venv/bin/python
        # Run security scan
        python scripts/pdev security

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # Release job removed - handled by dedicated release.yml workflow
  # The semantic-release workflow (release.yml) manages:
  # - Version bumping based on commit messages
  # - Changelog generation
  # - GitHub release creation
  # - Package publishing

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, detect-python-version]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Install twine
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade twine
    
    - name: Deploy to staging PyPI
      env:
        TWINE_USERNAME: ${{ secrets.STAGING_PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.STAGING_PYPI_PASSWORD }}
        TWINE_REPOSITORY_URL: ${{ secrets.STAGING_PYPI_URL }}
      run: |
        twine upload dist/* --verbose

  deploy-production:
    name: Deploy to Production (JFrog - GitHub Hosted)
    runs-on: ubuntu-latest  # Always GitHub-hosted for JFrog security
    needs: [build, detect-python-version]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ needs.detect-python-version.outputs.min-version }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Install twine
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade twine
    
    - name: Deploy to JFrog Artifactory
      env:
        ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USERNAME }}
        ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        TWINE_REPOSITORY_URL: "https://hypersec.jfrog.io/artifactory/api/pypi/hypersec-pypi-local/"
      run: |
        twine upload dist/* --verbose