name: Runner Selection Helper

# This reusable workflow determines which runner to use based on .env settings

on:
  workflow_call:
    outputs:
      runner-type:
        description: "The runner type to use (self-hosted or ubuntu-latest)"
        value: ${{ jobs.select-runner.outputs.runner-type }}

jobs:
  select-runner:
    name: Determine Runner Type
    runs-on: ubuntu-latest  # Always use GitHub for this quick check
    outputs:
      runner-type: ${{ steps.check.outputs.runner }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          .env
          .env.example
    
    - name: Check runner configuration
      id: check
      run: |
        # Default to self-hosted runners
        RUNNER_TYPE="self-hosted"
        
        # Check if .env file exists and has USE_GITHUB_CLOUD_RUNNERS setting
        if [ -f .env ]; then
          USE_CLOUD=$(grep "^USE_GITHUB_CLOUD_RUNNERS=" .env | cut -d= -f2 | tr -d '[:space:]' || echo "OFF")
          if [ "$USE_CLOUD" = "ON" ]; then
            RUNNER_TYPE="ubuntu-latest"
            echo "Using GitHub cloud runners (as configured in .env)"
          else
            echo "Using self-hosted runners (default for cost savings)"
          fi
        else
          echo "No .env file found, using self-hosted runners by default"
        fi
        
        echo "runner=$RUNNER_TYPE" >> $GITHUB_OUTPUT
        echo "Selected runner type: $RUNNER_TYPE"