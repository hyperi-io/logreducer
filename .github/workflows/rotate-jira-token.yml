name: JIRA Token Rotation Reminder

on:
  schedule:
    # Check monthly on the 1st at 9 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  check-token-age:
    name: Check Token Age
    runs-on: ubuntu-latest
    
    steps:
    - name: Check Token Creation Date
      id: check_age
      run: |
        # Token creation date stored in secret
        CREATED_DATE="${{ secrets.JIRA_TOKEN_CREATED }}"
        
        if [ -z "$CREATED_DATE" ]; then
          echo "⚠️ No token creation date found. Please set JIRA_TOKEN_CREATED secret."
          exit 1
        fi
        
        # Calculate days since creation
        CREATED_TIMESTAMP=$(date -d "$CREATED_DATE" +%s)
        NOW_TIMESTAMP=$(date +%s)
        DAYS_OLD=$(( (NOW_TIMESTAMP - CREATED_TIMESTAMP) / 86400 ))
        
        echo "Token is $DAYS_OLD days old"
        echo "days_old=$DAYS_OLD" >> $GITHUB_OUTPUT
        
        # Alert if older than 75 days (rotate at 90)
        if [ $DAYS_OLD -gt 75 ]; then
          echo "rotation_needed=true" >> $GITHUB_OUTPUT
        else
          echo "rotation_needed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Rotation Issue
      if: steps.check_age.outputs.rotation_needed == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // Check if issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: 'token-rotation',
            state: 'open'
          });
          
          if (issues.data.length === 0) {
            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔐 JIRA Token Rotation Required',
              body: `## Action Required: JIRA Token Rotation
              
              The JIRA API token is **${{ steps.check_age.outputs.days_old }}** days old and needs rotation.
              
              ### Steps to Rotate:
              
              1. Log into JIRA service account
              2. Go to: https://id.atlassian.com/manage-profile/security/api-tokens
              3. Revoke old token: \`GitHub-Integration-Prod\`
              4. Create new token: \`GitHub-Integration-Prod-[DATE]\`
              5. Update GitHub Secrets:
                 - \`JIRA_AUTH\`: New base64 encoded value
                 - \`JIRA_TOKEN_CREATED\`: Today's date (YYYY-MM-DD)
              6. Run test workflow to verify
              7. Close this issue
              
              **Deadline**: Tokens expire at 90 days (15 days remaining)
              
              cc: @yourusername`,
              labels: ['token-rotation', 'security', 'urgent']
            });
            
            console.log('✅ Rotation reminder issue created');
          } else {
            console.log('ℹ️ Rotation issue already exists');
          }