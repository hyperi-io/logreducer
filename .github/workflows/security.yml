name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt || echo "No requirements.txt found"
        pip install --upgrade pip-audit
        
    - name: Run pip-audit scan
      run: |
        echo "Running pip-audit dependency vulnerability scan..."
        pip-audit --format=json --output=pip-audit-report.json || true
        pip-audit --desc || true
        
        
    - name: Upload dependency scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-scan-results
        path: |
          pip-audit-report.json

  static-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --upgrade bandit[toml] semgrep
        
    - name: Run Bandit security linter
      run: |
        echo "Running Bandit static security analysis..."
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ --severity-level medium || true
        
    - name: Run Semgrep security analysis
      run: |
        echo "Running Semgrep semantic security analysis..."
        semgrep --config=auto src/ --json --output=semgrep-report.json || true
        semgrep --config=auto src/ --severity=WARNING || true
        
    - name: Upload static analysis results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: static-analysis-results
        path: |
          bandit-report.json
          semgrep-report.json

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Run TruffleHog secret scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image for scanning
      run: |
        cat > Dockerfile.security << EOF
        FROM python:${PYTHON_VERSION}-slim
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e .
        EOF
        docker build -t logreducer:security-scan -f Dockerfile.security .
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'logreducer:security-scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, static-analysis, secret-scan, codeql-analysis]
    if: always()
    
    steps:
    - name: Download all scan artifacts
      uses: actions/download-artifact@v4
      
    - name: Generate security summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Results Overview" >> security-summary.md
        echo "" >> security-summary.md
        
        # Check if dependency scan artifacts exist
        if [ -f dependency-scan-results/pip-audit-report.json ]; then
          PIP_AUDIT_ISSUES=$(jq '.vulnerabilities | length' dependency-scan-results/pip-audit-report.json 2>/dev/null || echo "0")
          echo "- **Dependency Vulnerabilities (pip-audit):** $PIP_AUDIT_ISSUES issues found" >> security-summary.md
        fi
        
        # Check if static analysis artifacts exist
        if [ -f static-analysis-results/bandit-report.json ]; then
          BANDIT_ISSUES=$(jq '.results | length' static-analysis-results/bandit-report.json 2>/dev/null || echo "0")
          echo "- **Static Security Issues (Bandit):** $BANDIT_ISSUES issues found" >> security-summary.md
        fi
        
        if [ -f static-analysis-results/semgrep-report.json ]; then
          SEMGREP_ISSUES=$(jq '.results | length' static-analysis-results/semgrep-report.json 2>/dev/null || echo "0")
          echo "- **Semantic Security Issues (Semgrep):** $SEMGREP_ISSUES issues found" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## Recommendations" >> security-summary.md
        echo "" >> security-summary.md
        echo "1. Review all HIGH and CRITICAL severity findings immediately" >> security-summary.md
        echo "2. Update vulnerable dependencies to patched versions" >> security-summary.md  
        echo "3. Fix any hardcoded secrets or credentials" >> security-summary.md
        echo "4. Address static analysis findings in order of severity" >> security-summary.md
        echo "5. Run security scans locally before committing code" >> security-summary.md
        
        echo "Generated security summary:"
        cat security-summary.md
        
    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary-report
        path: security-summary.md
        
    - name: Comment security summary on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('security-summary.md')) {
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🛡️ Security Scan Results\n\n' + summary
            });
          }