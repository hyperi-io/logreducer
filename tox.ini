[tox]
envlist = py312,py313
minversion = 4.0
requires = tox>=4.0

[testenv]
deps = 
    pytest>=7.0.0
    pytest-cov>=4.0.0
commands = 
    pytest tests/ -v --cov=logreducer --cov-report=term-missing

[testenv:lint]
deps = 
    black>=23.0.0
    flake8>=6.0.0
    mypy>=1.0.0
commands =
    black --check src/
    flake8 src/
    mypy src/logreducer/

[testenv:docs]
deps = 
    -e.[docs]
commands =
    sphinx-build -b html docs/ docs/_build/html
