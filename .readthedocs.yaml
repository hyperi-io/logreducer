# Read the Docs configuration file for LogReducer
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: "3.12"

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"  # Minimum supported version
    # Future versions: "3.12", "3.13", "3.14" (Oct 2025), "3.26" (Oct 2026), "3.27" (Oct 2027), "3.28" (Oct 2028)
    # Note: Python 3.15-3.25 will be skipped per PEP 2026 (calendar versioning)
    # You can also specify other tools here
    # node: "19"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/conf.py
   # You can configure Sphinx to use a different builder, for instance use the dirhtml builder for simpler URLs
   # builder: "dirhtml"
   # Fail on all warnings
   fail_on_warning: false

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
   install:
   - method: pip
     path: .
     extra_requirements:
       - docs
       - enhanced

# Per-version configuration
# You can have different config per version of your project
# versions:
#   latest:
#     formats: all
#   stable:
#     formats: all