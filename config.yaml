# LogReducer Configuration
# This file provides base configuration that can be overridden by:
# 1. Environment variables with APP_ prefix (e.g., APP_LOG_LEVEL=DEBUG)
# 2. CLI arguments

# Logging configuration (tee approach - both console and file by default)
log_level: INFO
log_format: "rfc3339"  # rfc3339, json, or custom
enable_console_log: true  # Set to false to disable console output
enable_file_log: true     # Set to false to disable file logging
log_file: null            # Custom log file path (default: .tmp/logs/script.log)

# Script configuration
dev:
  auto_fix: false
  verbose: true
  parallel_jobs: 4

security:
  report_only: false
  exit_on_fail: true
  tools:
    - pip-audit
    - bandit
    - semgrep

# Build configuration  
build:
  clean_first: true
  include_extras: true
  
# Test configuration
test:
  coverage: true
  parallel: true
  verbose: false
  
# Paths (relative to project root)
paths:
  venv: ".venv"
  scripts: "scripts"
  src: "src"
  tests: "tests"
  dist: "dist"
  data: "data"
