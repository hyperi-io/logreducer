modules:
  webtrigger:
    - key: github-release-webhook
      function: process-release
      
  function:
    - key: process-release
      handler: index.processRelease
      
  scheduledTrigger:
    - key: rotate-credentials
      function: rotate-creds
      schedule:
        expression: "0 2 1 * *"  # Monthly
        
app:
  id: ari:cloud:ecosystem::app/logreducer-integration
  name: LogReducer GitHub Integration
  
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - manage:jira-project
    
remotes:
  - key: github-backend
    baseUrl: https://api.github.com
    
storage:
  - key: credentials
    scope: app
    
environmentVariables:
  - GITHUB_REPO: hypersec-io/logreducer