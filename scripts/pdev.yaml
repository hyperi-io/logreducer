# LogReducer Development Configuration
# This file defines tool requirements and script configurations for development

# =============================================================================
# Base Configuration
# =============================================================================
base:
  # Default Python version if .python-version doesn't exist
  python_version_floor: "3.11"  # Universal minimum for Python projects
  # This project overrides to 3.12 via .python-version file

# =============================================================================
# Tool Requirements
# =============================================================================
tools:
  required:
    # Core development tools (must be available)
    python3:
      command: "python3"
      check: ["python3", "--version"]
      description: "Python 3.12+ interpreter"
      install_hint: "Install Python 3.12+ from your system package manager"
      
    uv:
      command: "uv"
      check: ["uv", "--version"]
      description: "UV package and virtual environment manager"
      install_hint: "curl -LsSf https://astral.sh/uv/install.sh | sh"

  optional:
    # Development tools (nice to have)
    git:
      command: "git"
      check: ["git", "--version"]
      description: "Git version control system"
      install_hint: "Install git from your system package manager"
      
    pre-commit:
      command: "pre-commit"
      check: ["pre-commit", "--version"]
      description: "Git pre-commit hooks framework"
      install_hint: "pip install pre-commit or uv pip install pre-commit"
      
    # Security scanning tools (installed via pip/uv)
    pip-audit:
      command: "pip-audit"
      check: ["pip-audit", "--version"]
      description: "Python package vulnerability scanner"
      install_hint: "uv pip install pip-audit"
      
    bandit:
      command: "bandit"
      check: ["bandit", "--version"]
      description: "Python security static analysis tool"
      install_hint: "uv pip install bandit[toml]"
      
    semgrep:
      command: "semgrep"
      check: ["semgrep", "--version"]
      description: "Semantic security analysis tool"
      install_hint: "uv pip install semgrep"
      
    # CI/CD and automation tools
    act:
      command: "act"
      check: ["act", "--version"]
      description: "Local GitHub Actions runner for CI/CD testing"
      install_hint: "sudo dnf copr enable goncalossilva/act && sudo dnf install act-cli"
    
    # System utilities
    curl:
      command: "curl"
      check: ["curl", "--version"]
      description: "HTTP client for downloads"
      install_hint: "Install curl from your system package manager"

  # Environment detection
  environment:
    venv_exists:
      check_path: ".venv"
      description: "Python virtual environment directory"
      
    config_exists:
      check_path: "config.yaml"
      description: "LogReducer configuration file"
      
    src_exists:
      check_path: "src/logreducer"
      description: "LogReducer source code directory"
      
    tests_exists:
      check_path: "tests"
      description: "Test suite directory"

  # Platform-specific tools
  platform:
    linux:
      ldd:
        command: "ldd"
        check: ["ldd", "--version"]
        description: "Dynamic library dependencies"
        install_hint: "Pre-installed on most Linux systems"
        
    darwin:  # macOS
      otool:
        command: "otool"
        check: ["otool", "-V"]
        description: "Object file analysis tool"
        install_hint: "Pre-installed with Xcode command line tools"
        
    win32:   # Windows
      where:
        command: "where"
        check: ["where", "/?"]
        description: "Windows command search utility"
        install_hint: "Pre-installed on Windows"

# =============================================================================
# Script Configuration  
# =============================================================================
config:
  # Logging configuration (tee approach - both console and file by default)
  logging:
    level: INFO
    format: "rfc3339"  # rfc3339, json, or custom
    enable_console: true  # Set to false to disable console output
    enable_file: true     # Set to false to disable file logging
    file: null            # Custom log file path (default: .tmp/logs/script.log)

  # Development script configuration
  dev:
    auto_fix: false
    verbose: true
    parallel_jobs: 4
    timeout_seconds: 300  # 5 minutes default timeout

  # Security scanning configuration
  security:
    report_only: false
    exit_on_fail: true
    timeout_seconds: 600  # 10 minutes for security scans
    tools:
      - pip-audit
      - bandit  
      - semgrep

  # Build configuration  
  build:
    clean_first: true
    include_extras: true
    timeout_seconds: 180  # 3 minutes
    
  # Test configuration
  test:
    coverage: true
    parallel: true
    verbose: false
    timeout_seconds: 300  # 5 minutes
    unit_timeout: 120     # 2 minutes for unit tests
    integration_timeout: 600  # 10 minutes for integration tests
    
  # Editable install testing
  editable_install:
    timeout_seconds: 10   # CLI test timeout
    test_import: true
    test_cli: true
    test_path_validation: true
    
  # Paths (relative to project root)
  paths:
    venv: ".venv"
    scripts: "scripts"
    src: "src"
    tests: "tests"
    dist: "dist"
    data: "data"
    tmp: ".tmp"
    logs: ".tmp/logs"
    reports: ".tmp/reports"
    security_reports: ".tmp/security-reports"

# =============================================================================
# Command Defaults
# =============================================================================
commands:
  format:
    line_length: 88
    target_versions: ["py312", "py313"]
    
  lint:
    max_line_length: 88
    ignore_errors: []  # E501, W503, etc.
    
  mypy:
    ignore_missing_imports: true
    show_error_codes: true
    
  pytest:
    markers:
      - "slow: marks tests as slow"
      - "integration: marks tests as integration tests" 
      - "unit: marks tests as unit tests"