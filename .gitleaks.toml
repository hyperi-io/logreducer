[extend]
useDefault = true

# Sample logs and test fixtures hold token-like strings that are not secrets.
[[allowlists]]
description = "logreducer false positives"
paths = [
    '''data/samples/.*''',
    '''tests/.*''',
]

# A placeholder ACCESS_TOKEN in a curl example, not a credential.
[[allowlists]]
description = "doc placeholder tokens in curl examples"
paths = [
    '''docs/JIRA_OAUTH_SETUP\.md''',
]
