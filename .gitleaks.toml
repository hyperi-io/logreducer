# Project:   logreducer
# File:      .gitleaks.toml
# Purpose:   Gitleaks configuration - allowlist false positives
# License:   Apache-2.0
# Copyright: (c) 2026 HYPERI PTY LIMITED

[extend]
useDefault = true

# Sample log files and test fixtures contain token-like strings that are not
# real secrets - logreducer's whole job is chewing through log lines.
[[allowlists]]
description = "logreducer false positives"
paths = [
    '''data/samples/.*''',
    '''tests/.*''',
]

# docs/JIRA_OAUTH_SETUP.md shows a curl example with the literal placeholder
# ACCESS_TOKEN in an Authorization header - documentation, not a credential.
[[allowlists]]
description = "doc placeholder tokens in curl examples"
paths = [
    '''docs/JIRA_OAUTH_SETUP\.md''',
]
