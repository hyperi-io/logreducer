[extend]
useDefault = true

# Sample log files and test fixtures contain token-like strings that are not
# real secrets - logreducer's whole job is chewing through log lines.
[[allowlists]]
description = "logreducer false positives"
paths = [
    '''data/samples/.*''',
    '''tests/.*''',
]
