[build-system]
requires = ["setuptools>=64.0.0", "wheel", "pip>=22.1"]
build-backend = "setuptools.build_meta"

[project]
name = "logreducer"
version = "3.2.1"
authors = [
    {name = "HyperSec Development Team", email = "dev@hypersec.io"},
]
description = "High-performance log reduction with intelligent pattern extraction and anomaly detection"
readme = "README.md"
license = "LicenseRef-HyperSec-EULA"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration", 
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
keywords = ["log", "logging", "reduction", "analysis", "pattern-extraction", "memory-efficient", "streaming", "anomaly-detection"]
dependencies = [
    "drain3>=0.9.0",
    "tqdm>=4.65.0", 
    "psutil>=6.0.0",  # Python 3.12+ compatibility, modern psutil
    "python-dateutil>=2.8.0",
    "loguru>=0.7.0",
    "numpy>=2.0.0",  # Future-proof: Use NumPy 2.0+ (released June 2024)
    "scikit-learn>=1.3.0",  # Correct package name (not deprecated 'sklearn')
]

[project.optional-dependencies]
enhanced = [
    "xxhash>=3.0.0",      # Fast hash functions for better performance
    "polars>=0.20.0",     # High-performance DataFrames (preferred over pandas)
    "scipy>=1.10.0",      # Advanced scientific computing
    "datasketch>=1.5.0",  # MinHash and LSH for similarity analysis
]
dev = [
    "pytest>=8.0.0",         # Modern test framework
    "pytest-cov>=5.0.0",     # Test coverage reporting
    "black>=24.0.0",         # Code formatting
    "flake8>=7.0.0",         # Code linting
    "mypy>=1.8.0",           # Static type checking
    "build>=1.0.0",          # Package building
    "twine>=5.0.0",          # PyPI package uploads
    "vermin>=1.6.0",         # Python version detection for automation
    "python-dotenv>=1.0.0",  # Environment configuration
    "pyyaml>=6.0.0",         # YAML configuration support
]
docs = [
    "sphinx>=8.0.0",          # Documentation generator
    "sphinx-rtd-theme>=3.0.0", # Read the Docs theme
    "myst-parser>=3.0.0",     # Markdown parser for Sphinx
    "sphinx-autobuild>=2024.0.0", # Live reload during development
]

[project.urls]
Homepage = "https://github.com/hypersec-io/logreducer"
Documentation = "https://hypersec-io.github.io/logreducer/"
Repository = "https://github.com/hypersec-io/logreducer"
"Bug Reports" = "https://github.com/hypersec-io/logreducer/issues"
Changelog = "https://github.com/hypersec-io/logreducer/blob/main/CHANGELOG.md"

[project.scripts]
logreducer = "logreducer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["logreducer*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
logreducer = ["py.typed"]

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py312', 'py313']
# Future target versions (uncomment when Black supports them):
# target-version = ['py311', 'py312', 'py313', 'py314']  # Add py314 when available
# Note: Black will add support for Python 3.26+ (calendar versioning) as py326, py327, py328
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | \.tmp
  | logs
)/
'''

# MyPy type checking
[tool.mypy]
python_version = "3.12"  # Matches minimum supported version
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# Coverage configuration  
[tool.coverage.run]
source = ["logreducer"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit security linting configuration
[tool.bandit]
exclude_dirs = [
    "tests",
    "test", 
    ".venv",
    "venv",
    ".tox",
    "build",
    "dist",
    "data/samples"
]
skips = ["B101", "B603"]

[tool.bandit.assert_used]
# Allow asserts in test files
skips = ["*test*.py", "*tests*.py"]

# pip-audit dependency vulnerability scanner
# Configuration via command line arguments in CI/CD

# Semantic Release Configuration
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/logreducer/__init__.py:__version__"]
build_command = "python -m build"
dist_path = "dist/"
upload_to_repository = false
upload_to_release = true
remove_dist = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore:",
    "^docs:",
    "^style:",
    "^refactor:",
    "^test:",
    "^build:",
]

[tool.semantic_release.commit_author]
env = "GIT_COMMITTER_NAME"
default = "semantic-release <semantic-release>"

commit_message = "{version}"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true