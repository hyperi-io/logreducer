[build-system]
requires = ["uv_build>=0.8.0,<1"]
build-backend = "uv_build"

[project]
name = "logreducer"
version = "3.4.0"
authors = [
    {name = "HyperI Team", email = "dev@hyperi.io"},
]
maintainers = [
    {name = "HyperI Team", email = "dev@hyperi.io"},
]
description = "High-performance log reduction with intelligent pattern extraction and anomaly detection"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# Python version policy: requires-python enforces the minimum. Do NOT add
# version-specific classifiers (3.12, 3.13, ...) - "3 :: Only" avoids churn
# on every new Python release. Matches the scalo-py convention.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration", 
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
keywords = ["log", "logging", "reduction", "analysis", "pattern-extraction", "memory-efficient", "streaming", "anomaly-detection"]
dependencies = [
    "drain3>=0.9.0",
    "tqdm>=4.65.0", 
    "psutil>=6.0.0",  # Python 3.12+ compatibility, modern psutil
    "python-dateutil>=2.8.0",
    "loguru>=0.7.0",
    "dynaconf>=3.2.0",  # Configuration management with precedence
    "numpy>=2.0.0",  # Future-proof: Use NumPy 2.0+ (released June 2024)
    "scikit-learn>=1.3.0",  # Correct package name (not deprecated 'sklearn')
]

[project.optional-dependencies]
enhanced = [
    "xxhash>=3.0.0",      # Fast hash functions for better performance
    "polars>=0.20.0",     # High-performance DataFrames (preferred over pandas)
    "scipy>=1.10.0",      # Advanced scientific computing
    "datasketch>=1.5.0",  # MinHash and LSH for similarity analysis
]
dev = [
    "pytest>=8.0.0",         # Test framework
    "pytest-cov>=5.0.0",     # Coverage reporting
    "ruff>=0.15.0",          # Lint + format (replaces black/flake8/isort)
    "ty>=0.0.34",            # Astral type checker (runs alongside mypy)
    "mypy>=1.8.0",           # Static type checking (strict; see [tool.mypy])
    "bandit[toml]>=1.7.0",   # Security linting
    "pip-audit>=2.6.0",      # Dependency vulnerability scanning
    "vulture>=2.16",         # Dead-code detection
    "vermin>=1.6.0",         # Python version-compat detection
    "pre-commit>=3.0.0",     # Git pre-commit hooks
    "python-dotenv>=1.0.0",  # Environment configuration for scripts
    "pyyaml>=6.0.1",         # YAML config support for scripts
    "requests>=2.31.0",      # For download_datasets script
]
docs = [
    "sphinx>=8.0.0",          # Documentation generator
    "sphinx-rtd-theme>=3.0.0", # Read the Docs theme
    "myst-parser>=3.0.0",     # Markdown parser for Sphinx
    "sphinx-autobuild>=2024.0.0", # Live reload during development
]

[project.urls]
Homepage = "https://github.com/hyperi-io/logreducer"
Documentation = "https://hyperi-io.github.io/logreducer/"
Repository = "https://github.com/hyperi-io/logreducer"
"Bug Reports" = "https://github.com/hyperi-io/logreducer/issues"
Changelog = "https://github.com/hyperi-io/logreducer/blob/main/CHANGELOG.md"

[project.scripts]
logreducer = "logreducer.cli:main"

[tool.uv.build-backend]
module-name = "logreducer"
module-root = "src"

# Ruff: lint + format (replaces black + flake8 + isort). Ported from
# scalo-py for a consistent HyperI Python lint posture. Line length 120.
[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
src = ["src"]
# examples/ are illustrative snippets, not scanned code (matches scalo-py).
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "S", "N", "PT",
    "RUF", "PIE", "T20",
]
ignore = [
    "ARG001", "ARG002",
    "B904", "B008", "B017", "B007", "B028",
    "E402", "E722", "E501", "E741",
    "SIM105", "SIM108", "SIM102",
    "F401", "F821", "F601",
    "TRY300", "C901", "UP035", "W191",
    # Intentional security relaxations in this codebase
    "S104",   # bind-all-interfaces (containers)
    "S110",   # try-except-pass (intentional error handling)
    "S112",   # try-except-continue (intentional skip)
    "S311",   # non-crypto random (jitter/sampling)
    "S603",   # subprocess without shell=True (helper scripts)
    "S607",   # partial executable path (helper scripts)
    "S608",   # hardcoded SQL (query builders, not user input)
    "T201",   # print (CLI output)
    "RUF012", "RUF059", "RUF001", "RUF002", "RUF005", "RUF006",
    "N806", "N818",
    "PIE810",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "S108", "F541", "RUF013",
    "PT017", "PT011", "PT012", "RUF043",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy: KEPT STRICT (deliberate deviation from scalo's relaxed profile -
# logreducer is small and already clean-typed). ignore_missing_imports only
# silences third-party libs without stubs (drain3, datasketch, ...); our own
# code stays fully typed via disallow_untyped_defs below.
[tool.mypy]
python_version = "3.12"  # Matches minimum supported version
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "8.0.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# Coverage configuration  
[tool.coverage.run]
source = ["logreducer"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit security linting configuration
[tool.bandit]
exclude_dirs = [
    "tests",
    "test", 
    ".venv",
    "venv",
    ".tox",
    "build",
    "dist",
    "data/samples"
]
skips = ["B101", "B603"]

# uv dependency resolution. Bleeding-edge policy: force latest majors even
# when transitive deps pin older lower bounds; revisit each /deps pass.
[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# ty: Astral type checker, runs alongside mypy.
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["examples/", "docs/", "scripts/"]

# vermin: verify no syntax/features newer than the minimum Python.
[tool.vermin]
targets = ["3.12"]
no_tips = true

[tool.bandit.assert_used]
# Allow asserts in test files
skips = ["*test*.py", "*tests*.py"]