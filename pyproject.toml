[build-system]
requires = ["uv_build>=0.8.0,<1"]
build-backend = "uv_build"

[project]
name = "logreducer"
version = "3.4.0"
authors = [
    {name = "HyperI Team", email = "dev@hyperi.io"},
]
maintainers = [
    {name = "HyperI Team", email = "dev@hyperi.io"},
]
description = "Reduces gigabytes of logs to a small, representative sample, as a CLI or a Python library."
# The PyPI page. README.md stays the GitHub front page.
readme = "docs/pypi.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
# No per-version classifiers: requires-python sets the minimum.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration", 
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
keywords = ["log", "logging", "reduction", "analysis", "pattern-extraction", "memory-efficient", "streaming", "anomaly-detection"]
dependencies = [
    "psutil>=7.2.2",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
]

# What each extra adds: docs/pypi.md "Extras".
[project.optional-dependencies]
enhanced = [
    "xxhash>=4.0.1",
    "datasketch>=2.0.0",
]
sql = [
    "sqlalchemy>=2.1.3",
]
clickhouse = [
    "clickhouse-connect>=1.9.0",
]
kafka = [
    "confluent-kafka>=2.15.1",
]
[project.urls]
Homepage = "https://github.com/hyperi-io/logreducer"
Documentation = "https://github.com/hyperi-io/logreducer#readme"
Repository = "https://github.com/hyperi-io/logreducer"
"Bug Reports" = "https://github.com/hyperi-io/logreducer/issues"
Changelog = "https://github.com/hyperi-io/logreducer/blob/main/CHANGELOG.md"

[project.scripts]
logreducer = "logreducer.cli:main"

[tool.uv.build-backend]
module-name = "logreducer"
module-root = "src"

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4
src = ["src"]
# examples/ are illustrative snippets, not scanned code.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "S", "N", "PT",
    "RUF", "PIE", "T20",
]
ignore = [
    "ARG001", "ARG002",
    "B904", "B008", "B017", "B007", "B028",
    "E402", "E722", "E501", "E741",
    "SIM105", "SIM108", "SIM102",
    "F821", "F601",
    "TRY300", "C901", "UP035", "W191",
    "S104",
    "S110",
    "S112",
    "S311",   # sampling, never anything secret
    "S603",   # the template-mining test runs a subprocess
    "S607",
    "S608",   # the samplers build SQL around the caller's query
    "T201",   # the CLI prints its output
    "RUF012", "RUF059", "RUF001", "RUF002", "RUF005", "RUF006",
    "N806", "N818",
    "PIE810",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# vulture's own codes, which it reads from `# noqa`.
external = ["V"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "S108", "F541", "RUF013",
    "PT017", "PT011", "PT012", "RUF043",
]
# The quality gate's S and D passes select their rules on the command line,
# which drops the ignore list above, so their exemptions live here.
# The class docstring documents construction and the dunder protocol methods.
"src/**" = ["D105", "D107"]
# The samplers wrap SQL the caller wrote, by design: identifiers are quoted and
# every interpolated number goes through int() or float().
"src/logreducer/sampling.py" = ["S608"]
"src/logreducer/clickhouse.py" = ["S608"]
# Sampling and jitter, never anything secret.
"src/logreducer/core.py" = ["S311"]
"src/logreducer/memory.py" = ["S311"]
"src/logreducer/target.py" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ignore_missing_imports: datasketch and other third-party libs ship no stubs.
[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "8.0.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
shared_service_repo = "logreducer"

[tool.coverage.run]
source = ["logreducer"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    "test", 
    ".venv",
    "venv",
    ".tox",
    "build",
    "dist",
    "data/samples"
]
skips = ["B101", "B603"]

[tool.uv]
index-strategy = "unsafe-best-match"
# Supply-chain cooldown. A CVE fix bypasses it with a per-package entry.
exclude-newer = "7 days"
override-dependencies = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# build_quiet_golden.py runs under uvx with drain3, which is never a dependency here.
exclude = ["examples/", "docs/", "scripts/", "tests/testdata/build_quiet_golden.py"]

# Below 80 vulture reports the library's public API and attributes set on
# third-party config objects, which buries a real leftover.
[tool.vulture]
min_confidence = 80

[tool.vermin]
targets = ["3.14"]
no_tips = true

[tool.bandit.assert_used]
skips = ["*test*.py", "*tests*.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",   # hyperi-ci adds -n
    "ruff>=0.16.10",
    "ty>=0.0.34",
    "mypy>=2.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.6.0",
    "vulture>=2.16",
    "vermin>=1.6.0",
    # The extras again, so the adapter tests run. Test services: tests/TESTING.md.
    "xxhash>=4.0.2",
    "datasketch>=2.0.0",
    "sqlalchemy>=2.1.3",
    "clickhouse-connect>=1.9.0",
    "confluent-kafka>=2.15.1",
    "scalo>=2.32.4",
    "testcontainers[postgres,mysql]>=4.15.0",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",       # tests/conftest.py loads a local .env
]
